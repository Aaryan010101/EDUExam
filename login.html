<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - EduExam Hub</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            overflow: hidden;
            position: relative;
        }

        /* ===== Animated Background ===== */
        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .bg-gradient::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(56,189,248,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255,60,172,0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(34,211,238,0.08) 0%, transparent 50%);
            animation: bgRotate 20s linear infinite;
        }
        @keyframes bgRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(56,189,248,0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ===== Login Container ===== */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        /* Back to home link */
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }
        .back-home:hover {
            color: #38BDF8;
            transform: translateX(-4px);
        }
        .back-home i {
            font-size: 1.1rem;
        }

        /* Card */
        .login-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 48px 40px;
            position: relative;
            overflow: hidden;
            animation: cardSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        @keyframes cardSlideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Card glow border */
        .login-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(56,189,248,0.3), transparent 40%, transparent 60%, rgba(255,60,172,0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Top accent glow */
        .login-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #38BDF8, transparent);
        }

        /* ===== Logo ===== */
        .login-logo {
            text-align: center;
            margin-bottom: 8px;
        }
        .login-logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
        }
        .login-logo h1 .e-letter {
            font-size: 2.6rem;
            font-weight: 700;
            color: #38BDF8;
            font-family: 'Times New Roman', Times, serif;
            text-shadow: 0 0 8px rgba(56,189,248,0.4);
        }
        .login-logo h1 .h-letter {
            color: #38BDF8;
        }
        .login-subtitle {
            text-align: center;
            color: rgba(255,255,255,0.45);
            font-size: 0.9rem;
            font-weight: 400;
            margin-bottom: 36px;
        }

        /* ===== Form ===== */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group label {
            display: block;
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.25);
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-wrapper input::placeholder {
            color: rgba(255,255,255,0.2);
        }
        .input-wrapper input:focus {
            border-color: #38BDF8;
            background: rgba(56,189,248,0.04);
            box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
        }
        .input-wrapper input:focus + i,
        .input-wrapper input:focus ~ i {
            color: #38BDF8;
        }
        /* Icon inside input - fix for sibling selector */
        .input-wrapper:focus-within i {
            color: #38BDF8;
        }

        /* Password toggle */
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.25);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.3s;
            padding: 4px;
        }
        .password-toggle:hover {
            color: #38BDF8;
        }

        /* Remember & Forgot */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .remember-me input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 5px;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }
        .remember-me input[type="checkbox"]:checked {
            background: #38BDF8;
            border-color: #38BDF8;
        }
        .remember-me input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0a0a0f;
            font-size: 12px;
            font-weight: 700;
        }
        .remember-me span {
            color: rgba(255,255,255,0.45);
            font-size: 0.85rem;
        }
        .forgot-link {
            color: #38BDF8;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s;
        }
        .forgot-link:hover {
            color: #22d3ee;
            text-shadow: 0 0 8px rgba(56,189,248,0.3);
        }

        /* ===== Login Button ===== */
        @keyframes btnShimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .login-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #38BDF8, #22d3ee, #38BDF8);
            background-size: 200% auto;
            border: none;
            border-radius: 14px;
            color: #0a0a0f;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        .login-submit:hover {
            animation: btnShimmer 2s linear infinite;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(56,189,248,0.3), 0 0 15px rgba(56,189,248,0.2);
        }
        .login-submit:active {
            transform: translateY(0);
        }
        .login-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Loading spinner on submit */
        .login-submit.loading {
            color: transparent;
        }
        .login-submit.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            margin: -11px 0 0 -11px;
            border: 3px solid rgba(10,10,15,0.2);
            border-top-color: #0a0a0f;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Divider ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 28px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.06);
        }
        .divider span {
            color: rgba(255,255,255,0.25);
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===== Social Login ===== */
        .social-login {
            display: flex;
            gap: 12px;
        }
        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
        }
        .social-btn:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }
        .social-btn i {
            font-size: 1.3rem;
        }
        .social-btn.google:hover {
            border-color: rgba(234,67,53,0.4);
            box-shadow: 0 0 15px rgba(234,67,53,0.1);
        }
        .social-btn.github:hover {
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
        }

        /* ===== Signup Link ===== */
        .signup-text {
            text-align: center;
            margin-top: 28px;
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
        }
        .signup-text a {
            color: #38BDF8;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .signup-text a:hover {
            color: #22d3ee;
            text-shadow: 0 0 8px rgba(56,189,248,0.3);
        }

        /* ===== Error Message ===== */
        .error-msg {
            background: rgba(255,60,60,0.08);
            border: 1px solid rgba(255,60,60,0.2);
            border-radius: 10px;
            padding: 12px 16px;
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: shakeIn 0.4s ease;
        }
        .error-msg.show {
            display: flex;
        }
        @keyframes shakeIn {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* ===== Success toast ===== */
        .success-toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(16,185,129,0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(16,185,129,0.3);
            padding: 16px 32px;
            border-radius: 14px;
            color: #10b981;
            font-weight: 600;
            font-size: 0.95rem;
            z-index: 1000;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .success-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
            }
            .social-login {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>

    <!-- Success Toast -->
    <div class="success-toast" id="successToast">
        <i class='bx bx-check-circle' style="font-size:1.3rem"></i>
        Login Successful! Redirecting...
    </div>

    <!-- Login Form -->
    <div class="login-wrapper">
        <a href="./index.html" class="back-home">
            <i class='bx bx-arrow-back'></i>
            Back to Home
        </a>

        <div class="login-card">
            <!-- Logo -->
            <div class="login-logo">
                <h1>
                    <span class="e-letter">E</span>duExam 
                    <span class="h-letter">H</span>ub
                </h1>
            </div>
            <p class="login-subtitle">Sign in to access your study materials</p>

            <!-- Error Message -->
            <div class="error-msg" id="errorMsg">
                <i class='bx bx-error-circle' style="font-size:1.2rem; flex-shrink:0"></i>
                <span id="errorText">Invalid email or password</span>
            </div>

            <!-- Form -->
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class='bx bx-envelope'></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class='bx bx-lock-alt'></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                            <i class='bx bx-hide'></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="login-submit" id="loginBtn">
                    Sign In
                </button>
            </form>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-login">
                <button class="social-btn google" type="button">
                    <i class='bx bxl-google'></i>
                    Google
                </button>
                <button class="social-btn github" type="button">
                    <i class='bx bxl-github'></i>
                    GitHub
                </button>
            </div>

            <p class="signup-text">
                Don't have an account? <a href="#">Create one</a>
            </p>
        </div>
    </div>

    <script>
        // ===== Floating Particles =====
        (function createParticles() {
            const container = document.getElementById('particles');
            const count = 30;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                p.style.animationDelay = (Math.random() * 8) + 's';
                p.style.background = Math.random() > 0.5
                    ? 'rgba(56,189,248,0.25)'
                    : 'rgba(255,60,172,0.2)';
                container.appendChild(p);
            }
        })();

        // ===== Password Toggle =====
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.querySelector('i').className = isPassword ? 'bx bx-show' : 'bx bx-hide';
        });

        // ===== Form Submission =====
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const successToast = document.getElementById('successToast');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Hide any previous error
            errorMsg.classList.remove('show');
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Basic validation
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showError('Please enter a valid email address');
                return;
            }

            if (password.length < 4) {
                showError('Password must be at least 4 characters');
                return;
            }

            // Show loading state
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            // Simulate authentication delay
            await new Promise(resolve => setTimeout(resolve, 1500));

            // For demo: accept any valid-looking credentials
            // In production, replace with real API call
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userEmail', email);

            // Show success
            loginBtn.classList.remove('loading');
            successToast.classList.add('show');

            // Redirect to homepage
            setTimeout(() => {
                window.location.href = './index.html';
            }, 1500);
        });

        function showError(message) {
            errorText.textContent = message;
            errorMsg.classList.add('show');
        }

        // ===== If already logged in, redirect =====
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = './index.html';
        }
    </script>
</body>
</html>
