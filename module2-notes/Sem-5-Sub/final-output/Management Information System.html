<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Royal Notes Course App</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}
body{
  font-family:Poppins,Arial,sans-serif;
  background:#292e33;
  color:#e5e7eb;
  user-select:none;
  overflow:hidden;
}
.app{display:flex;height:100vh}

/* ===== Sidebar ===== */
.sidebar{
  width:280px;
  background:linear-gradient(180deg,#1b0717fe,#12040f);
  padding:20px;
  overflow-y:auto;
  position:fixed;
  inset:0 auto 0 0;
  z-index:2000;
  transition:.35s;
}
.sidebar h2{font-size:22px;margin-bottom:18px}
.section{
  background:rgba(255,255,255,.06);
  padding:14px;
  border-radius:10px;
  margin-bottom:10px;
  cursor:pointer;
}
.section.active,.section:hover{
  background:rgba(18,247,255,.18);
}
.close-side{
  display:none;
  font-size:22px;
  cursor:pointer;
  position:absolute;
  top:16px;
  right:16px;
  color:#12f7ff;
}

/* ===== Main ===== */
.main{
  flex:1;
  margin-left:280px;
  display:flex;
  flex-direction:column;
}

/* ===== Topbar ===== */
.topbar{
  background:#111827;
  padding:14px 20px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.brand-title{
  font-size:32px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}
.brand-e{
  font-family:"Times New Roman",serif;
  font-size:42px;
  color:#12f7ff;
}
.brand-accent{color:#12f7ff}

/* ===== Viewer ===== */
.viewer{
  flex:1;
  background:#1f2933;
  overflow:auto;
  padding:20px;
}
.notes-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

/* ===== Images ===== */
.note-img{
  width:100%;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.5);
  cursor:pointer;
}

/* ===== Modal ===== */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  justify-content:center;
  align-items:center;
  z-index:5000;
}
.modal img{
  max-width:95%;
  max-height:90%;
  transition:transform .2s ease;
}
.close-modal{
  position:absolute;
  top:20px;
  right:25px;
  font-size:28px;
  color:#12f7ff;
  cursor:pointer;
}

/* Navigation */
.nav-controls{
  position:absolute;
  top:50%;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
  transform:translateY(-50%);
  pointer-events:none;
}
.nav-controls button{
  pointer-events:all;
  background:#12f7ff;
  border:none;
  font-size:22px;
  width:50px;
  height:50px;
  border-radius:50%;
  font-weight:bold;
  color:#021014;
}

/* Zoom */
.zoom-controls{
  position:absolute;
  bottom:25px;
  display:flex;
  gap:12px;
}
.zoom-controls button{
  background:#12f7ff;
  color:#021014;
  border:none;
  font-size:18px;
  width:42px;
  height:42px;
  border-radius:50%;
  font-weight:bold;
}

/* ===== Menu Button (Stable Version) ===== */
.menu-btn{
  display:none;
  position:fixed;
  top:14px;
  left:14px;
  background:#12f7ff;
  color:#021014;
  border:none;
  padding:8px 12px;
  border-radius:10px;
  font-weight:600;
  z-index:6000;
}
.menu-btn.hide{display:none!important}

/* ===== Responsive ===== */
@media(max-width:768px){

  .main{margin-left:0}

  .sidebar{
    left:-300px;
  }
  .sidebar.show{
    left:0;
  }

  .close-side{display:block}
  .menu-btn{display:block}

  .notes-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .brand-title{
    font-size:22px;
  }

  .brand-e{
    font-size:50px;
    font-weight: 900;
  }
}
@media(max-width:480px){
  .notes-grid{grid-template-columns:1fr}
  .brand-e{
    font-size:50px;
    font-weight: 900;
  }
}
</style>
</head>

<body oncontextmenu="return false">

<button class="menu-btn" id="menuBtn" onclick="openSidebar()">☰</button>

<div class="app">

  <div class="sidebar" id="sidebar">
    <span class="close-side" onclick="closeSidebar()">✖</span>
    <h2>MIS</h2>

    <div class="section active" onclick="loadNotes('index',this)">INDEX</div>
    <div class="section" onclick="loadNotes('notes',this)">ALL NOTES</div>
  </div>

  <div class="main">
    <div class="topbar">
      <h1 class="brand-title">
        <span class="brand-e">E</span>du<span class="brand-accent">Exam</span> Hub
      </h1>
    </div>

    <div class="viewer">
      <div id="content" class="notes-grid"></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <span class="close-modal" onclick="closeModal()">×</span>

  <div class="nav-controls">
    <button onclick="prevImage()">⟨</button>
    <button onclick="nextImage()">⟩</button>
  </div>

  <img id="modalImg">

  <div class="zoom-controls">
    <button onclick="zoomIn()">+</button>
    <button onclick="zoomOut()">−</button>
    <button onclick="resetZoom()">⟳</button>
  </div>
</div>

<script>
const notes = {
  index: ['images/INDEX.png'],
  notes: Array.from({length: 19}, (_, i) => `images-mis/${i+1}.png`)
};

let currentImages=[];
let currentIndex=0;
let scale=1;

function loadNotes(topic,el){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');

  const box=document.getElementById('content');
  box.innerHTML='';
  currentImages=notes[topic];

  currentImages.forEach((src,index)=>{
    const img=document.createElement('img');
    img.src=src;
    img.className='note-img';
    img.onclick=()=>{
      currentIndex=index;
      openModal();
    };
    box.appendChild(img);
  });

  closeSidebar();
}

function openModal(){
  modal.style.display='flex';
  modalImg.src=currentImages[currentIndex];
  scale=1;
  modalImg.style.transform='scale(1)';
}
function closeModal(){ modal.style.display='none'; }

function nextImage(){
  currentIndex=(currentIndex+1)%currentImages.length;
  modalImg.src=currentImages[currentIndex];
}
function prevImage(){
  currentIndex=(currentIndex-1+currentImages.length)%currentImages.length;
  modalImg.src=currentImages[currentIndex];
}

/* Arrow Support */
document.addEventListener("keydown",function(e){
  if(modal.style.display==="flex"){
    if(e.key==="ArrowRight") nextImage();
    if(e.key==="ArrowLeft") prevImage();
  }
});

/* Swipe Support */
let startX=0;
modal.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
});
modal.addEventListener("touchend",e=>{
  let endX=e.changedTouches[0].clientX;
  if(startX-endX>50) nextImage();
  if(endX-startX>50) prevImage();
});

function zoomIn(){
  scale=Math.min(scale+0.2,4);
  modalImg.style.transform=`scale(${scale})`;
}
function zoomOut(){
  scale=Math.max(scale-0.2,1);
  modalImg.style.transform=`scale(${scale})`;
}
function resetZoom(){
  scale=1;
  modalImg.style.transform='scale(1)';
}

function openSidebar(){
  sidebar.classList.add('show');
  menuBtn.classList.add('hide');
}
function closeSidebar(){
  sidebar.classList.remove('show');
  menuBtn.classList.remove('hide');
}

loadNotes('index',document.querySelector('.section'));
</script>

</body>
</html>
